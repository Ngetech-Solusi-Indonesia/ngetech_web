services:
  web:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ngetech.studio}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ngetech.studio}
      DATA_DIR: /app/data
      CMS_COOKIE_SECURE: "true"
    volumes:
      - ngetech-data:/app/data
volumes:
  ngetech-data:
